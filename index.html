 S.group.rows.forEach(function(r){if(r._fixed||r._origin!=='csv')return;var w=trim(r.korean);if(w&&!seen[w]){seen[w]=true;out.push(w);}});
 return out;
};
menuItems=function(part){
 clear($('menuList'));var q=trim($('searchInput').value).toLowerCase();
 if(q){
  var matches=TEACHING.concat(S.rows).filter(function(r){return(!part||r.part===part)&&(r.korean+' '+r.english+' '+r.part_title).toLowerCase().indexOf(q)>=0;});
  matches.slice(0,100).forEach(function(r){var b=el('button','search-result');b.appendChild(el('b','',r.korean));b.appendChild(el('small','',r.part+' \u00b7 '+(r._fixed?'\uae30\ubcf8 \uad50\uc721':'\ubc18\ubcf5 \uc219\ub2ec')));b.onclick=function(){goTo(r.id);};$('menuList').appendChild(b);});return;
 }
 if(part){
  var p=partBy(part);
  [p.all].concat(p.groups).forEach(function(g){var b=el('button','course-tile');b.appendChild(el('b','',g.title));b.appendChild(el('small','',g.rows.length+'\uc7a5'));b.onclick=function(){var cloud=S.view==='cloud';closeMenu(false);choosePart(p.id,cloud?'cloud':'practice',g.id);};$('menuList').appendChild(b);});return;
 }
 Object.keys(SECTIONS).forEach(function(sec){
  var area=el('section','course-section');area.appendChild(el('h2','','PART '+sec+' \u00b7 '+SECTIONS[sec][0]));var grid=el('div','course-grid');
  S.parts.filter(function(p){return p.section===sec;}).forEach(function(p){
   var b=el('button','course-tile'+(S.part&&S.part.id===p.id?' current':''));
   b.appendChild(el('span','course-code',p.id+' \u00b7 \uad50\uc721 '+p.guide.length+' \u00b7 \uc5f0\uc2b5 '+p.practice.length));
   b.appendChild(el('b','',p.title));b.appendChild(el('small','',p.en));
   b.onclick=function(){closeMenu(false);choosePart(p.id,'intro');};grid.appendChild(b);
  });area.appendChild(grid);$('menuList').appendChild(area);
 });
};
install=function(raw,source){
 // Only the practice bank changes. Active teaching content, index and phase are untouched.
 var rows=normalize(raw),oldPart=S.part&&S.part.id,oldGroup=S.group&&S.group.id;
 S.rows=rows;S.source=source||'none';S.practiceSource=source||'none';buildGroups();
 if(!S.ready){S.ready=true;choosePart(COURSE_ORDER[0],'intro');return;}
 S.part=partBy(oldPart)||S.parts[0];S.group=S.part.groups.filter(function(g){return g.id===oldGroup;})[0]||S.part.all;
 header();
 if(S.view==='cloud'||S.view==='lessonEnd')render();
 if(S.modal)menuItems(S.menuPart);
};
network=function(){
 if(S.networkBusy||!config.defaultCsvUrl)return;
 S.networkBusy=true;S.networkAt=Date.now();$('totalCount').title='\uc5f0\uc2b5 \uc790\ub8cc \ud655\uc778 \uc911';
 var xhr=new XMLHttpRequest();xhr.open('GET',config.defaultCsvUrl,true);xhr.timeout=16000;
 function failed(message){S.networkBusy=false;$('totalCount').classList.add('offline');$('totalCount').title='\uc5f0\uc2b5 \uc790\ub8cc \uc5f0\uacb0 \uc2e4\ud328. \uae30\ubcf8 \uad50\uc721\uc740 \uadf8\ub300\ub85c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.'+(message?' '+message:'');if(!S.rows.length)toast('\uc5f0\uc2b5 \uc790\ub8cc\ub97c \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. \uae30\ubcf8 \uad50\uc721\uc740 \uc815\uc0c1 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.');}
 xhr.onload=function(){
  if(xhr.status<200||xhr.status>=300){failed('HTTP '+xhr.status);return;}
  try{
   var raw=parseCSV(xhr.responseText);install(raw,'remote');
   store('practice-cache',{version:5,origin:'csv',url:config.defaultCsvUrl,rows:raw,at:Date.now()});
   S.networkBusy=false;$('totalCount').classList.remove('offline');
   $('totalCount').title='\uc5f0\uc2b5 \uc790\ub8cc '+S.rows.length+'\uc7a5 \u00b7 \uae30\ubcf8 \uad50\uc721\uc740 \uace0\uc815';
  }catch(e){failed(e.message);}
 };
 xhr.onerror=function(){failed();};xhr.ontimeout=function(){failed();};try{xhr.send();}catch(e){failed(e.message);}
};

var wheelAt=0;$('readingCard').addEventListener('wheel',function(e){if(S.view==='cloud')return;e.preventDefault();if(Date.now()-wheelAt<600)return;wheelAt=Date.now();if(e.deltaY>12)next();else if(e.deltaY< -12)prev();},{passive:false});
var touchStart=null;$('readingCard').addEventListener('touchstart',function(e){if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('readingCard').addEventListener('touchend',function(e){if(!touchStart||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();if(dx<0)next();else prev();}},{passive:false});
document.addEventListener('keydown',function(e){var k=e.key||'',tag=document.activeElement&&document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'){if(k==='Escape')closeMenu();return;}if(S.modal){if(k==='Escape'||e.keyCode===461){e.preventDefault();closeMenu();}return;}if(k==='Enter'&&tag==='BUTTON')return;
 if(k==='ArrowRight'||k==='Enter'||k===' '||e.keyCode===13){e.preventDefault();next();}else if(k==='ArrowLeft'){e.preventDefault();prev();}else if(k==='ArrowUp'||k==='m'||k==='M'){e.preventDefault();openMenu();}else if(k==='Escape'){if(S.view==='cloud'){startPractice();}else openMenu();}else if(k==='t'||k==='T')$('cloudMode').click();else if(k==='r'||k==='R')startPractice();else if(k==='f'||k==='F')fullscreen();else if(k==='PageDown'||k==='PageUp'){e.preventDefault();jumpCard(k==='PageDown'?1:-1);}});
window.addEventListener('resize',function(){fit();});window.addEventListener('orientationchange',function(){setTimeout(fit,200);});if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);document.addEventListener('visibilitychange',function(){if(document.hidden)stopAudio();});window.addEventListener('focus',function(){if(Date.now()-S.networkAt>120000)network();});

if(/[?&]qa=1(?:&|$)/.test(location.search))window.HangulPractice.test={rows:function(){return S.rows;},teaching:function(){return TEACHING;},normalize:normalize,install:install,render:render,state:S,parts:function(){return S.parts;},cloudWords:cloudWords,layoutCloud:layoutCloud};
